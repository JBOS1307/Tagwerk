<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Tagwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--paper:#fffefb;--ink:#1f1f1e;--ink2:#6a6a66;--ink3:#a6a59f;--line:#e5e3dc;--dot:#dddbd3;
  --accent:#1d8bf1;--accent-soft:rgba(29,139,241,.12);--ok:#2b9a66;--ok-soft:rgba(43,154,102,.14);--warn:#d9662f;
  --mark:#fff0a0;--radius:14px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#131313;--paper:#1b1b1b;--ink:#e9e7e2;--ink2:#9e9d98;--ink3:#5e5d5a;--line:#2a2a29;--dot:#232322;
  --accent:#45a6ff;--accent-soft:rgba(69,166,255,.15);--ok:#47c086;--ok-soft:rgba(71,192,134,.15);--mark:#5b4e12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;min-height:100vh;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(90px + var(--sb))}
.topbar{position:sticky;top:0;z-index:5;padding:calc(var(--st) + 14px) 0 10px;display:flex;align-items:center;gap:6px;background:linear-gradient(var(--bg) 78%,transparent)}
.topbar h1{font-family:var(--mono);font-weight:600;font-size:22px;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active,.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:22px;height:22px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(4px + var(--sb))}
nav.tabs .wrap{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:11px;color:var(--ink3);position:relative;font-weight:500}
nav.tabs button.active{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:0;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-head h2,.section-title{font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0}
.section-title{margin:20px 2px 8px}
.link{color:var(--accent);font-size:14px;font-weight:500}
.muted{color:var(--ink2);font-size:14px;margin:0}
.btn{padding:10px 16px;border-radius:11px;background:var(--bg);border:1px solid var(--line);font-weight:500;font-size:15px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.block{width:100%;display:block;margin-top:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--paper);outline:none;font-size:16px}
.field:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty .big{font-family:var(--mono);font-size:30px;margin-bottom:6px;color:var(--ink3)}
.empty p{margin:4px 0 14px}
/* Heute */
.hero{padding:2px 2px 14px}
.hero-day{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
.hero-date{color:var(--ink2);font-family:var(--mono);font-size:14px}
.capture{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.capture textarea{width:100%;border:0;outline:none;background:none;resize:none;font-family:var(--mono);font-size:16px;line-height:1.5;min-height:26px;max-height:40vh}
.capture-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.capture-actions .btn{padding:7px 13px;font-size:14px}
.today-habits{display:flex;gap:16px;align-items:center}
.ring{flex:none;position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:16px}
.th-list{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.th{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:14px;max-width:100%}
.th .th-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.stat-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat-num{font-family:var(--mono);font-size:26px;font-weight:600}
/* Bullet-Journal Todos */
.todo{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.bujo{width:26px;height:26px;flex:none;border-radius:8px;font-family:var(--mono);font-size:22px;line-height:24px;text-align:center;color:var(--ink);margin-top:-1px}
.bujo:active{background:var(--accent-soft)}
.todo .t-text{flex:1;cursor:pointer;padding-top:1px;word-break:break-word}
.todo.done .bujo{color:var(--ink3)}
.todo.done .t-text{color:var(--ink3);text-decoration:line-through}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;margin-bottom:2px}
.group-head b{font-family:var(--mono);font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-head span{font-size:12px;color:var(--ink3);white-space:nowrap}
/* Notes list */
.note-card{cursor:pointer;position:relative}
.nc-title{font-family:var(--mono);font-weight:600;font-size:15.5px;margin-bottom:3px;word-break:break-word;padding-right:34px}
.nc-prev{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nc-meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink3);font-family:var(--mono)}
.pill{padding:1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.nc-archive{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.nc-archive:active{background:var(--accent-soft);color:var(--accent)}
.nc-archive svg{width:20px;height:20px}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;min-height:86px;display:flex;flex-direction:column;justify-content:space-between}
.area-card b{font-family:var(--mono);font-size:15px}
.area-card small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area-card .cnt{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink2)}
.area-card.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink2);background:transparent}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(80px + var(--sb));width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:15}
.fab svg{width:26px;height:26px;stroke-width:2.2}
/* Pages (overlays) */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.page.in{transform:none}
.page-bar{display:flex;align-items:center;gap:4px;padding:calc(var(--st) + 8px) 8px 6px;max-width:760px;width:100%;margin:0 auto}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;padding:8px 6px;border-radius:10px;max-width:50%}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back svg{width:22px;height:22px;flex:none}
.spacer{flex:1}
.wc{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-right:4px;white-space:nowrap}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px calc(40px + var(--sb))}
.page-inner{max-width:680px;margin:0 auto}
/* Editor – iA-Writer-Stil */
.ed-toolbar{display:none;gap:2px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none;max-width:760px;width:100%;margin:0 auto;border-bottom:1px solid var(--line)}
.ed-toolbar::-webkit-scrollbar{display:none}
.ed-toolbar.show{display:flex}
.ed-toolbar button{min-width:40px;height:36px;border-radius:9px;font-family:var(--mono);font-size:15px;color:var(--ink2);flex:none;padding:0 8px}
.ed-toolbar button:active{background:var(--accent-soft);color:var(--accent)}
.note-body{background:var(--paper)}
.editor{display:block;width:100%;max-width:680px;margin:0 auto;border:0;outline:none;background:transparent;resize:none;font-family:var(--mono);font-size:17px;line-height:1.7;caret-color:var(--accent);min-height:60vh;padding:10px 0 40vh;overflow:hidden}
.editor::placeholder{color:var(--ink3)}
.md{max-width:680px;margin:0 auto;font-family:var(--mono);font-size:17px;line-height:1.7;padding:10px 0 30vh;word-break:break-word;cursor:text}
.md h2,.md h3,.md h4{margin:.4em 0 .2em;line-height:1.3;font-weight:600}
.md h2{font-size:1.45em}.md h3{font-size:1.2em}.md h4{font-size:1.05em}
.md p{margin:0}
.md .gap{height:.85em}
.md .li{display:flex;gap:.6em}
.md .li .sig{color:var(--ink3);flex:none;width:1em;text-align:center}
.md .todo{padding:2px 0}
.md .todo .bujo{font-size:21px;height:28px;line-height:28px}
.md blockquote{margin:.2em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--ink2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md mark,.md-inline mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.md code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.92em}
.md del{color:var(--ink3)}
/* News */
.edition{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--ink2);margin:0 2px 12px}
.edition b{color:var(--ink)}
.news-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.news-item:last-child{border-bottom:0}
.news-item .ni-text{flex:1;min-width:0}
.news-item .ni-meta{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.news-item .ni-title{font-weight:600;font-size:15.5px;line-height:1.35;word-break:break-word}
.news-item.read .ni-title{color:var(--ink3);font-weight:500}
.news-item img{width:74px;height:74px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg)}
.ni-star{width:40px;height:40px;margin:-6px -10px 0 -4px;border-radius:10px;display:grid;place-items:center;color:var(--ink3);flex:none}
.ni-star svg{width:21px;height:21px}
.ni-star.on{color:#e8a317}
.ni-star:active{background:var(--accent-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.article h1{font-family:var(--sans);font-size:24px;line-height:1.25;margin:6px 0 10px}
.article .meta{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.article .content{font-size:17.5px;line-height:1.65;margin-top:14px;word-break:break-word}
.article .content img{max-width:100%;height:auto;border-radius:10px}
.article .hero-img{width:100%;border-radius:12px;margin-top:12px;max-height:320px;object-fit:cover}
.done-box{text-align:center;padding:30px 10px;color:var(--ink2)}
.done-box .big{font-size:34px;font-family:var(--mono);color:var(--ok)}
.feed-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.feed-row .grow b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row .grow small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row .err{color:var(--warn)}
/* Habits */
.habit{padding:12px 14px}
.h-top{display:flex;align-items:center;gap:12px}
.h-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.h-emoji{font-size:26px;width:36px;text-align:center;flex:none}
.h-name{font-weight:600;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-sub{font-size:12.5px;color:var(--ink2);font-family:var(--mono)}
.h-check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.h-check svg{width:24px;height:24px;stroke-width:2.6}
.habit.is-done .h-check{background:var(--ok);border-color:var(--ok);color:#fff}
.habit.week-met:not(.is-done) .h-check{border-color:var(--ok);color:var(--ok)}
.h-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.h-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.h-day b{width:100%;max-width:34px;height:10px;border-radius:5px;background:var(--line);display:block}
.h-day.on b{background:var(--ok)}
.h-day.today i{color:var(--ink);font-weight:600}
.h-day i{font-style:normal}
.summary{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.summary .txt b{font-family:var(--mono);font-size:20px;display:block}
.summary .txt span{color:var(--ink2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:20px}
.stats span{font-size:11px;color:var(--ink2)}
.heat-wrap{overflow-x:auto;padding:3px 3px 4px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(12px,1fr);gap:3px;min-width:100%}
.heat button{aspect-ratio:1;border-radius:3px;background:var(--line);min-width:12px}
.heat button.on{background:var(--ok)}
.heat button.today{outline:2px solid var(--accent);outline-offset:1px}
.heat button:disabled{opacity:.25;cursor:default}
.heat-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:6px}
/* Sheet */
#sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheet.open{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.32);animation:fade .18s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;padding:0 18px calc(18px + var(--sb));max-height:calc(100% - var(--st) - 24px);overflow-y:auto;overscroll-behavior:contain;animation:up .22s ease;transition:transform .2s}
.sheet-panel.drag{transition:none}
.sheet-top{position:sticky;top:0;z-index:3;background:var(--paper);padding:8px 0 4px;margin:0 -18px 6px;touch-action:none}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 6px}
.sheet-x{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.sheet-x svg{width:16px;height:16px;stroke-width:2.4}
.sheet-panel h3{padding-right:40px}
.sheet-panel h3{font-family:var(--mono);font-size:17px;margin:4px 0 12px}
.sheet-panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:18px 0 8px;font-family:var(--mono)}
.list-btn{display:flex;width:100%;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
.list-btn:last-child{border-bottom:0}
.list-btn small{margin-left:auto;color:var(--ink3);font-size:13px}
.list-btn.danger{color:var(--warn)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
/* Bücher */
.shelf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.bk{text-align:left;min-width:0}
.cv{aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.13);display:grid;place-items:center;width:100%}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{font-family:var(--mono);font-size:11px;padding:6px;text-align:center;color:var(--ink2);word-break:break-word;line-height:1.3}
.bk b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px;word-break:break-word}
.bk small{color:var(--ink3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .mini-stars{color:#e8a317;font-size:11px;letter-spacing:1px}
.reading{display:flex;gap:14px;align-items:flex-start}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:9px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.res{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:center}
.res .cv{width:44px;flex:none}
.res b{display:block;font-size:15px;line-height:1.3}
.res small{color:var(--ink2);font-size:13px}
.stars{display:flex;gap:2px;margin-top:8px}
.stars button{font-size:26px;line-height:1;color:var(--line)}
.stars button.on{color:#e8a317}

<script>
'use strict';
/* =========================================================
   Tagwerk – Notizen · Todos · News · Gewohnheiten
   Alle Daten liegen lokal im Browser (localStorage).
   ========================================================= */

// ---------- Helfer ----------
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dk = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD2 = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON3 = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function relDate(ts){
  const d = new Date(ts), now = new Date();
  const diff = Math.round((new Date(dk(now)) - new Date(dk(d))) / 864e5);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (diff === 0) { const m = Math.round((now - d) / 6e4); return m < 1 ? 'gerade eben' : m < 60 ? `vor ${m} Min.` : `heute ${hm}`; }
  if (diff === 1) return `gestern ${hm}`;
  if (diff < 7) return `${WD2[d.getDay()]} ${hm}`;
  return `${d.getDate()}. ${MON3[d.getMonth()]}${d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : ''}`;
}

const I = {
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  check:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>',
  rss:'<svg viewBox="0 0 24 24"><path d="M5 4.5a14.5 14.5 0 0 1 14.5 14.5"/><path d="M5 10.5a8.5 8.5 0 0 1 8.5 8.5"/><circle cx="6" cy="18" r="1.4" fill="currentColor"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path d="M12 3c.8 3.6 5 5.4 5 10.2A5 5 0 0 1 7 13.4c0-2.4 1.3-3.9 2.4-5 .3 1.8 1 2.7 2 3.1-.2-3 0-5.6.6-8.5z"/></svg>',

  more:'<svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></svg>',
  archive:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5"/><path d="M10 12.5h4"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/></svg>',
  ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20V4a.5.5 0 0 1 .5-.5z"/><path d="M9 12h6M9 16h4"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  tick:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};

// ---------- Daten ----------
const KEY = 'tagwerk.v1';
const defaultSettings = () => ({ bookGoal:0, intent:true, theme:'auto', editions:true, editionTimes:['07:00','18:00'], proxy:'', lastFetch:0 });
const defaultState = () => ({
  v: 1,
  notes: [],
  areas: ['Ideen','Arbeit','Familie','Projekte','Wissen'].map(name => ({ id: uid(), name })),
  feeds: [], items: [], habits: [], books: [],
  settings: defaultSettings(),
});
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = Object.assign(defaultState(), JSON.parse(raw)); s.settings = Object.assign(defaultSettings(), s.settings); return s; }
  } catch (e) { console.error(e); }
  return defaultState();
}
let S = load();
let saveT;
function save(now, silent){
  if (!silent) { S.modified = Date.now(); if (typeof schedulePush === 'function') schedulePush(); }
  clearTimeout(saveT);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern fehlgeschlagen – Speicher voll?'); } };
  now ? w() : (saveT = setTimeout(w, 200));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
window.addEventListener('pagehide', () => save(true));

const UI = { view:'heute', notesTab:'inbox', area:null, search:'', todoFilter:'open', newsFilter:'unread', newsFeed:'all', refreshing:false, noteId:null, noteEdit:false, bookShelf:'reading', bookId:null, addStatus:'want', results:[] };

// ---------- Theme ----------
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = S.settings.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.settings.theme;
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t === 'dark' ? '#131313' : '#f6f5f1';
}
mq.addEventListener?.('change', applyTheme);
applyTheme();

// ---------- Notizen & Todos ----------
const TODO_RE = /^(\s*)(?:[-*+]\s+)?\[( |x|X)\]\s?(.*)$/;
const getNote = id => S.notes.find(n => n.id === id);
const areaName = id => (S.areas.find(a => a.id === id) || {}).name || 'Ohne Bereich';
function cleanLine(l){ return l.replace(/^\s*(#{1,6}\s+|[-*+]\s+\[[ xX]\]\s?|\[[ xX]\]\s?|[-*+]\s+|>\s?|\d+\.\s+)/,'').replace(/\*\*|==|~~|`/g,'').replace(/(^|\s)\*(\S)/g,'$1$2').trim(); }
function noteTitle(n){ const l = n.body.split('\n').find(x => x.trim()); return l ? cleanLine(l).slice(0, 90) || 'Ohne Titel' : 'Ohne Titel'; }
function notePreview(n){ const ls = n.body.split('\n').filter(x => x.trim()); return ls.slice(1, 4).map(cleanLine).join(' · ').slice(0, 180); }
function todosOf(n){ const out = []; n.body.split('\n').forEach((l, i) => { const m = l.match(TODO_RE); if (m && m[3].trim()) out.push({ noteId:n.id, line:i, done:m[2] !== ' ', text:m[3] }); }); return out; }
function allTodos(){ return S.notes.flatMap(todosOf); }
function toggleTodo(noteId, line){
  const n = getNote(noteId); if (!n) return;
  const lines = n.body.split('\n');
  lines[line] = lines[line].replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]');
  n.body = lines.join('\n'); n.updated = Date.now(); save();
}
function newNote(body = '', extra = {}){
  const n = { id: uid(), body, status:'inbox', areaId:null, created:Date.now(), updated:Date.now(), ...extra };
  S.notes.unshift(n); save(); return n;
}
function quickTodoNote(){
  let n = S.notes.find(x => x.quick);
  if (!n) n = newNote('# Schnelle Todos\n', { quick:true });
  return n;
}
function addQuickTodos(text){
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean).map(s => '[ ] ' + s.replace(/^\[[ xX]\]\s*/, ''));
  if (!lines.length) return 0;
  const n = quickTodoNote();
  n.body = n.body.replace(/\s*$/, '') + '\n' + lines.join('\n') + '\n';
  n.updated = Date.now(); save(); return lines.length;
}

// Markdown (bewusst schlank): # Überschriften, **fett**, *kursiv*, ~~durch~~, ==markiert==, `code`, - Liste, [ ] Todo, > Zitat, ---
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s](?:[^*]*[^*\s])?)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/==([^=]+)==/g, '<mark>$1</mark>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function renderMd(body, noteId){
  return body.split('\n').map((l, i) => {
    let m;
    if ((m = l.match(TODO_RE))) {
      const done = m[2] !== ' ';
      return `<div class="todo ${done ? 'done' : ''}" style="margin-left:${Math.min(m[1].length, 8) * .5}em"><button class="bujo" data-act="todo" data-note="${noteId}" data-line="${i}" aria-label="Todo umschalten">${done ? '×' : '•'}</button><span class="t-text">${inline(m[3])}</span></div>`;
    }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { const h = m[1].length + 1; return `<h${h}>${inline(m[2])}</h${h}>`; }
    if ((m = l.match(/^(\s*)[-*+]\s+(.*)$/))) return `<div class="li" style="margin-left:${Math.min(m[1].length, 8) * .5}em"><span class="sig">–</span><span>${inline(m[2])}</span></div>`;
    if ((m = l.match(/^(\s*)(\d+)\.\s+(.*)$/))) return `<div class="li"><span class="sig">${m[2]}.</span><span>${inline(m[3])}</span></div>`;
    if ((m = l.match(/^>\s?(.*)$/))) return `<blockquote>${inline(m[1])}</blockquote>`;
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) return '<hr>';
    if (!l.trim()) return '<div class="gap"></div>';
    return `<p>${inline(l)}</p>`;
  }).join('');
}

// ---------- Gewohnheiten ----------
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weekCount(h, d){ const ws = weekStart(d); let c = 0; for (let i = 0; i < 7; i++) if (h.log[dk(addDays(ws, i))]) c++; return c; }
const isWeekly = h => h.freq === 'weekly';
function doneToday(h){ return !!h.log[dk()] || (isWeekly(h) && weekCount(h, new Date()) >= h.target); }
function streak(h){
  if (!isWeekly(h)) { let d = new Date(); if (!h.log[dk(d)]) d = addDays(d, -1); let c = 0; while (h.log[dk(d)]) { c++; d = addDays(d, -1); } return c; }
  let ws = weekStart(new Date()), c = 0;
  if (weekCount(h, ws) >= h.target) c++;
  ws = addDays(ws, -7);
  while (weekCount(h, ws) >= h.target) { c++; ws = addDays(ws, -7); }
  return c;
}
function bestStreak(h){
  const keys = Object.keys(h.log).filter(k => h.log[k]).sort(); if (!keys.length) return 0;
  const [y, mo, da] = keys[0].split('-').map(Number); let d = new Date(y, mo - 1, da); const end = new Date();
  let best = 0, cur = 0;
  if (!isWeekly(h)) { while (d <= end) { if (h.log[dk(d)]) { cur++; best = Math.max(best, cur); } else cur = 0; d = addDays(d, 1); } return best; }
  d = weekStart(d);
  while (d <= end) { if (weekCount(h, d) >= h.target) { cur++; best = Math.max(best, cur); } else if (d < weekStart(end)) cur = 0; d = addDays(d, 7); }
  return best;
}
function rate30(h){
  let c = 0; for (let i = 0; i < 30; i++) if (h.log[dk(addDays(new Date(), -i))]) c++;
  const goal = isWeekly(h) ? h.target * 30 / 7 : 30;
  return Math.min(100, Math.round(c / goal * 100));
}
function toggleHabit(id, day){ const h = S.habits.find(x => x.id === id); if (!h) return; if (h.log[day]) delete h.log[day]; else h.log[day] = 1; save(); }
function freqLabel(h){ return isWeekly(h) ? `${h.target}× pro Woche` : 'täglich'; }
function streakLabel(h){ const s = streak(h); if (!s) return freqLabel(h); return `🔥 ${s} ${isWeekly(h) ? (s === 1 ? 'Woche' : 'Wochen') : (s === 1 ? 'Tag' : 'Tage')} · ${freqLabel(h)}`; }
function ring(done, total, size = 76){
  const r = 32, c = 2 * Math.PI * r, p = total ? done / total : 0;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 76 76" style="width:${size}px;height:${size}px"><circle cx="38" cy="38" r="${r}" stroke="var(--line)" stroke-width="7"/><circle cx="38" cy="38" r="${r}" stroke="var(--ok)" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="transition:stroke-dashoffset .4s"/></svg><div class="lbl">${done}/${total}</div></div>`;
}

// ---------- News / RSS ----------
const DEFAULT_PROXIES = [
  u => u,
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];
function proxies(){
  const list = [...DEFAULT_PROXIES], p = S.settings.proxy.trim();
  if (p) list.unshift(u => p.includes('{url}') ? p.replace('{url}', encodeURIComponent(u)) : p + encodeURIComponent(u));
  return list;
}
async function fetchText(url){
  let lastErr;
  for (const p of proxies()) {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(p(url), { signal: ctrl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text();
      if (t && t.length > 40) return t;
      throw new Error('Leere Antwort');
    } catch (e) { lastErr = e; } finally { clearTimeout(to); }
  }
  throw lastErr || new Error('Nicht erreichbar');
}
const kid = (el, name) => [...el.children].find(c => c.localName === name);
const ktxt = (el, name) => { const c = kid(el, name); return c ? c.textContent.trim() : ''; };
function firstImg(html){ const m = /<img[^>]+src=["']([^"']+)["']/i.exec(html || ''); return m ? m[1] : ''; }
function parseFeed(text, url){
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  if (!xml.querySelector('parsererror')) {
    const root = xml.documentElement.localName.toLowerCase();
    if (root === 'rss' || root === 'rdf') {
      const ch = xml.getElementsByTagName('channel')[0];
      const items = [...xml.getElementsByTagName('item')].map(it => {
        const html = ktxt(it, 'encoded') || ktxt(it, 'description');
        const enc = kid(it, 'enclosure'), mc = kid(it, 'content'), mt = kid(it, 'thumbnail');
        let img = (enc && /image/.test(enc.getAttribute('type') || '') && enc.getAttribute('url')) || (mc && mc.getAttribute('url')) || (mt && mt.getAttribute('url')) || firstImg(html);
        if (!img) { const g = kid(it, 'group'); const gc = g && (kid(g, 'content') || kid(g, 'thumbnail')); if (gc) img = gc.getAttribute('url'); }
        return { title: ktxt(it, 'title'), link: ktxt(it, 'link'), guid: ktxt(it, 'guid'), date: ktxt(it, 'pubDate') || ktxt(it, 'date'), html, img };
      });
      return { title: ch ? ktxt(ch, 'title') : '', items };
    }
    if (root === 'feed') {
      const items = [...xml.getElementsByTagName('entry')].map(it => {
        const links = [...it.children].filter(c => c.localName === 'link');
        const l = links.find(x => (x.getAttribute('rel') || 'alternate') === 'alternate') || links[0];
        const html = ktxt(it, 'content') || ktxt(it, 'summary');
        const enc = links.find(x => x.getAttribute('rel') === 'enclosure' && /image/.test(x.getAttribute('type') || ''));
        const mt = kid(it, 'thumbnail');
        return { title: ktxt(it, 'title'), link: l ? l.getAttribute('href') : '', guid: ktxt(it, 'id'), date: ktxt(it, 'published') || ktxt(it, 'updated'), html, img: (enc && enc.getAttribute('href')) || (mt && mt.getAttribute('url')) || firstImg(html) };
      });
      return { title: ktxt(xml.documentElement, 'title'), items };
    }
  }
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const l = doc.querySelector('link[rel~="alternate"][type*="rss"],link[rel~="alternate"][type*="atom"]');
  if (l) return { discover: new URL(l.getAttribute('href'), url).href };
  throw new Error('Kein Feed gefunden');
}
async function refreshFeed(f){
  try {
    let text = await fetchText(f.url), p = parseFeed(text, f.url);
    if (p.discover) { f.url = p.discover; text = await fetchText(f.url); p = parseFeed(text, f.url); if (p.discover) throw new Error('Kein Feed gefunden'); }
    if (!f.title || f.title === f.url) f.title = p.title || new URL(f.url).hostname;
    const known = new Set(S.items.filter(i => i.feedId === f.id).map(i => i.id));
    let added = 0;
    p.items.slice(0, 60).forEach(it => {
      const id = f.id + '|' + (it.guid || it.link || it.title);
      if (known.has(id) || !it.title) return;
      let ts = Date.parse(it.date); if (isNaN(ts)) ts = Date.now();
      S.items.push({ id, feedId: f.id, title: it.title.replace(/\s+/g, ' '), link: it.link, date: ts, html: (it.html || '').slice(0, 40000), img: it.img || '', read: false, saved: false });
      added++;
    });
    f.error = null; f.lastOk = Date.now();
    return added;

function editionInfo(){
  const now = new Date(), times = (S.settings.editionTimes || []).filter(t => /^\d{1,2}:\d{2}$/.test(t)).sort();
  if (!S.settings.editions || !times.length) return { on:false, due: Date.now() - S.settings.lastFetch > 30 * 6e4 };
  const cand = [];
  [-1, 0, 1].forEach(off => times.forEach(t => { const [h, m] = t.split(':').map(Number); const d = addDays(now, off); d.setHours(h, m, 0, 0); cand.push(d); }));

const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

function sanitize(html){
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const ok = new Set(['P','BR','B','STRONG','I','EM','A','UL','OL','LI','BLOCKQUOTE','H2','H3','H4','IMG','FIGURE','FIGCAPTION','SPAN','DIV','SMALL','SUB','SUP','CODE','PRE','HR']);

    [...el.children].forEach(c => {
      if (!ok.has(c.tagName)) { if (['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','SVG','VIDEO','AUDIO'].includes(c.tagName)) c.remove(); else { walk(c); c.replaceWith(...c.childNodes); } return; }
      [...c.attributes].forEach(a => {
        const keep = (c.tagName === 'A' && a.name === 'href' && /^https?:/i.test(a.value)) || (c.tagName === 'IMG' && (a.name === 'src' && /^https?:/i.test(a.value) || a.name === 'alt'));

}

async function addFeed(url){

  S.feeds.push(f); save(); toast('Lade Feed …');

async function searchBooks(q){
  q = q.trim(); const clean = q.replace(/[-\s]/g, ''), isIsbn = /^(97[89])?\d{9}[\dXx]$/.test(clean);
  const out = [];
  try {
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&q=' + encodeURIComponent(isIsbn ? 'isbn:' + clean : q));
    const j = await r.json();
    (j.items || []).forEach(it => {
      const v = it.volumeInfo || {}; if (!v.title) return;
      out.push({ title: v.title + (v.subtitle ? ': ' + v.subtitle : ''), author: (v.authors || []).join(', '),
        cover: ((v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '').replace('http://', 'https://').replace('&edge=curl', ''),
        pages: v.pageCount || 0, year: (v.publishedDate || '').slice(0, 4),
        isbn: ((v.industryIdentifiers || []).find(x => x.type === 'ISBN_13') || {}).identifier || '' });
    });
  } catch (e) {}
  if (!out.length) {
    try {
      const r = await fetch('https://openlibrary.org/search.json?limit=20&fields=title,author_name,cover_i,number_of_pages_median,first_publish_year,isbn&' + (isIsbn ? 'isbn=' + clean : 'q=' + encodeURIComponent(q)));
      const j = await r.json();
      (j.docs || []).forEach(d => out.push({ title: d.title, author: (d.author_name || []).join(', '), cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '', pages: d.number_of_pages_median || 0, year: d.first_publish_year ? String(d.first_publish_year) : '', isbn: (d.isbn || [])[0] || '' }));
    } catch (e) {}
  }
  return out;
}

function wordCount(){ const n = getNote(UI.noteId), el = topPage() && $('#wc', topPage()); if (!n || !el) return; const w = (n.body.match(/[\p{L}\p{N}]+/gu) || []).length; el.textContent = `${w} W · ${Math.max(1, Math.round(w / 200))} Min`; }
function grow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

    openSheet(`<h3>Durchgelesen! 🎉</h3><p class="muted">Wie fandest du „${esc(b.title)}“?</p><div class="stars" style="justify-content:center;margin:14px 0">${[1,2,3,4,5].map(n => `<button style="font-size:38px" data-act="book-rate" data-id="${b.id}" data-n="${n}" data-close="1">★</button>`).join('')}</div><button class="btn block" data-act="close-sheet">Später</button>`);
  } else toast(diff > 0 ? `+${diff} Seiten` : 'Gespeichert');
  refreshBooks();
}

// Sheet nach unten wischen = schließen
(() => {
  let y0 = null, dy = 0, panel = null;
  document.addEventListener('touchstart', e => {
    panel = e.target.closest('.sheet-panel'); if (!panel) return;
    const onTop = e.target.closest('.sheet-top');
    if (!onTop && panel.scrollTop > 0) { panel = null; return; }
    if (e.target.closest('input,textarea,select')) { panel = null; return; }
    y0 = e.touches[0].clientY; dy = 0; panel.classList.add('drag');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!panel || y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && panel.scrollTop <= 0) panel.style.transform = `translateY(${dy}px)`; else dy = 0;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!panel) return;
    panel.classList.remove('drag');
    if (dy > 90) closeSheet(); else panel.style.transform = '';
    panel = null; y0 = null; dy = 0;
  });
})();

// ---------- Toast ----------
let toastT;
function toast(msg, label, fn){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${label ? `<button id="toast-btn">${esc(label)}</button>` : ''}`;
  if (label) $('#toast-btn').onclick = () => { fn(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), label ? 5000 : 2600);
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) {
    // Im Lesemodus: Tippen auf Text = Schreiben (wie iA Writer)
    if (e.target.closest('#md') && !e.target.closest('a')) { UI.noteEdit = true; paintNote(); }
    return;
  }
  const d = a.dataset;
  switch (d.act) {
    case 'go': closeSheet(); go(d.view); break;
    case 'back': closePage(); break;
    case 'close-sheet': closeSheet(); break;
    case 'settings': openSettings(); break;

    // Notizen
    case 'new-note': { const n = newNote('', UI.area ? { status:'archived', areaId:UI.area } : {}); openNote(n.id, true); break; }
    case 'open-note': closeSheet(); openNote(d.id, false); break;
    case 'notes-tab': UI.notesTab = d.tab; render(); break;
    case 'open-area': UI.area = d.id; window.scrollTo(0, 0); render(); break;
    case 'area-back': UI.area = null; UI.notesTab = 'areas'; render(); break;
    case 'archive-pick': e.stopPropagation(); openArchiveSheet(d.id); break;
    case 'archive-to': archiveNote(d.id, d.area); break;
    case 'to-inbox': { const n = getNote(d.id); n.status = 'inbox'; n.areaId = null; save(); closeSheet(); toast('Zurück im Eingang'); if (pageStack.length) closePage(); else render(); break; }
    case 'delete-note': {
      const n = getNote(d.id), idx = S.notes.indexOf(n);
      S.notes.splice(idx, 1); save(); closeSheet();
      toast('Notiz gelöscht', 'Rückgängig', () => { S.notes.splice(idx, 0, n); save(); render(); });
      if (pageStack.length) closePage(); else render();
      break;
    }
    case 'copy-note': navigator.clipboard?.writeText(getNote(d.id).body).then(() => toast('Kopiert')); closeSheet(); break;
    case 'note-mode': UI.noteEdit = !UI.noteEdit; paintNote(); break;
    case 'note-menu': openNoteMenu(); break;
    case 'fmt': {
      const ta = topPage() && $('#ed', topPage()); if (!ta) break;
      e.preventDefault();
      if (d.k === 'wrap') edWrap(ta, d.v);
      else if (d.k === 'pre') edPrefix(ta, d.v);
      else { const s = ta.selectionStart; ta.setRangeText('\n---\n', s, ta.selectionEnd, 'end'); ta.focus(); ta.dispatchEvent(new Event('input', { bubbles: true })); }
      break;
    }
    case 'todo': {
      toggleTodo(d.note, +d.line);
      if (a.closest('#md')) { const y = $('#note-body', topPage()).scrollTop; paintNote(); $('#note-body', topPage()).scrollTop = y; }
      else render();
      break;
    }
    case 'todo-filter': UI.todoFilter = d.f; render(); break;
    case 'capture-todo': {
      const ta = a.closest('form').querySelector('textarea'); const n = addQuickTodos(ta.value);
      if (n) { ta.value = ''; grow(ta); toast(`${n} Todo${n > 1 ? 's' : ''} notiert`); render(); } else ta.focus();
      break;
    }
    case 'add-area': {
      const name = prompt('Name des neuen Bereichs:'); if (!name || !name.trim()) break;
      S.areas.push({ id: uid(), name: name.trim() }); save();
      $('#sheet').classList.contains('open') ? openSettings() : render();
      break;
    }
    case 'rename-area': { const ar = S.areas.find(x => x.id === d.id); const name = prompt('Neuer Name:', ar.name); if (name && name.trim()) { ar.name = name.trim(); save(); openSettings(); render(); } break; }
    case 'del-area': {
      const ar = S.areas.find(x => x.id === d.id), cnt = S.notes.filter(n => n.areaId === ar.id).length;
      if (!confirm(`Bereich „${ar.name}“ löschen?${cnt ? `\n${cnt} Notizen wandern zurück in den Eingang.` : ''}`)) break;
      S.notes.forEach(n => { if (n.areaId === ar.id) { n.areaId = null; n.status = 'inbox'; } });
      S.areas = S.areas.filter(x => x.id !== ar.id); save(); openSettings(); render();
      break;
    }

    // News
    case 'refresh': {
      const ed = editionInfo();
      if (ed.on && !ed.due) {
        openSheet(`<h3>Noch keine neue Ausgabe</h3><p class="muted">Die nächste Ausgabe kommt ${nextLabel(ed)}. Bis dahin gibt’s nichts Wichtiges zu verpassen.</p><button class="btn primary block" data-act="close-sheet">Okay, warte ich</button><button class="btn block" data-act="force-refresh">Trotzdem jetzt laden</button>`);
      } else refreshFeeds();
      break;
    }
    case 'force-refresh': closeSheet(); refreshFeeds(); break;
    case 'feeds': openFeedsSheet(); break;
    case 'add-feed': addFeed(d.url); break;
    case 'del-feed': { const f = S.feeds.find(x => x.id === d.id); if (!confirm(`„${f.title || f.url}“ entfernen?`)) break; S.feeds = S.feeds.filter(x => x.id !== d.id); if (UI.newsFeed === d.id) UI.newsFeed = 'all'; pruneItems(); save(); openFeedsSheet(); render(); break; }
    case 'news-filter': UI.newsFilter = d.f; render(); break;
    case 'news-feed': UI.newsFeed = d.id; render(); break;
    case 'open-item': openItem(d.id); break;
    case 'row-save': {
      const it = S.items.find(i => i.id === d.id); if (!it) break;
      it.saved = !it.saved; save();
      a.classList.toggle('on', it.saved); a.innerHTML = it.saved ? I.starOn : I.star;
      toast(it.saved ? 'Gemerkt' : 'Nicht mehr gemerkt');
      if (UI.newsFilter === 'saved' && !it.saved) render();
      break;
    }
    case 'item-save': { const it = S.items.find(i => i.id === d.id); it.saved = !it.saved; save(); a.innerHTML = it.saved ? I.starOn : I.star; toast(it.saved ? 'Gemerkt' : 'Nicht mehr gemerkt'); break; }
    case 'item-note': { const it = S.items.find(i => i.id === d.id); newNote(`# ${it.title}\n${it.link || ''}\n\n`); save(); toast('Im Eingang gespeichert'); break; }
    case 'mark-all-read': S.items.forEach(i => { if (UI.newsFeed === 'all' || i.feedId === UI.newsFeed) i.read = true; }); save(false, true); render(); break;

    // Bücher
    case 'book-shelf': UI.bookShelf = d.s; render(); break;
    case 'book-add': openBookAdd(); break;
    case 'add-status': UI.addStatus = d.s; a.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === a)); break;
    case 'book-pick': {
      const r = UI.results[+d.i]; if (!r) break;
      const b = addBook(r, UI.addStatus); closeSheet(); UI.bookShelf = UI.addStatus;
      toast(`„${b.title}“ hinzugefügt`); if (UI.view !== 'buecher') go('buecher'); else render();
      break;
    }
    case 'book-manual':
      openSheet(`<h3>Buch manuell anlegen</h3><form data-form="book-manual"><input class="field" name="title" placeholder="Titel" required><input class="field" name="author" placeholder="Autor/in" style="margin-top:8px"><input class="field" name="pages" type="number" inputmode="numeric" placeholder="Seitenzahl" style="margin-top:8px"><button class="btn primary block" style="margin-top:12px">Anlegen</button></form>`);
      break;
    case 'book-open': closeSheet(); openBook(d.id); break;
    case 'book-edit': {
      const b = getBook(d.id);
      openSheet(`<h3>Buch bearbeiten</h3><form data-form="book-edit" data-id="${b.id}">
        <label class="muted">Seitenzahl <span style="font-size:13px">(z. B. vom E-Book-Reader)</span></label>
        <input class="field" name="pages" type="number" inputmode="numeric" min="0" value="${b.pages || ''}" style="margin:4px 0 12px;font-size:22px;font-family:var(--mono)">
        <label class="muted">Titel</label><input class="field" name="title" value="${esc(b.title)}" style="margin:4px 0 12px">
        <label class="muted">Autor/in</label><input class="field" name="author" value="${esc(b.author)}" style="margin-top:4px">
        <button class="btn primary block" style="margin-top:16px">Speichern</button></form>`);
      setTimeout(() => { const i = $('#sheet input[name=pages]'); i?.focus(); i?.select(); }, 250);
      break;
    }
    case 'book-progress': openProgress(d.id); break;
    case 'page-plus': { const i = a.closest('form').page; i.value = (parseInt(i.value) || 0) + +d.n; break; }
    case 'book-status': { const b = getBook(d.id); setBookStatus(b, d.s); UI.bookShelf = d.s; refreshBooks(); break; }
    case 'book-rate': { const b = getBook(d.id); b.rating = b.rating === +d.n && !d.close ? 0 : +d.n; b.updated = Date.now(); save(); if (d.close) { closeSheet(); toast('Bewertet'); } refreshBooks(); break; }
    case 'book-goal': { const v = prompt(`Wie viele Bücher willst du ${new Date().getFullYear()} lesen?`, S.settings.bookGoal || ''); if (v !== null) { S.settings.bookGoal = Math.max(0, parseInt(v) || 0); save(); render(); } break; }
    case 'book-menu': openSheet(`<h3>${esc(getBook(d.id).title)}</h3><button class="list-btn" data-act="book-edit" data-id="${d.id}">✎ Bearbeiten (Titel, Autor, Seitenzahl)</button><button class="list-btn danger" data-act="book-delete" data-id="${d.id}">✕ Aus dem Regal löschen</button>`); break;

    }

    // Einstellungen
    case 'intent-set': S.settings.intent = d.v === '1'; save(); openSettings(); break;
    case 'intent': handleIntent(d.i); break;
    case 'sync-now': sync(true).then(() => $('#sheet').classList.contains('open') && openSettings()); break;
    case 'sync-off': if (confirm('Sync auf diesem Gerät trennen? Deine Daten bleiben hier und im Gist erhalten.')) { SY = {}; saveSync(); openSettings(); } break;
    case 'conflict-dl': {
      const blob = new Blob([localStorage.getItem(CONFLICT_KEY)], { type: 'application/json' }), url = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = url; l.download = `tagwerk-konflikt-${dk()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); break;
    }
    case 'theme': S.settings.theme = d.v; save(); applyTheme(); openSettings(); break;
    case 'editions': S.settings.editions = d.v === '1'; save(); openSettings(); render(); break;
    case 'export': {
      const name = `tagwerk-backup-${dk()}.json`;
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Tagwerk-Backup' }).catch(() => {}); break; }
      const url = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); break;
    }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.onchange = async () => {
        try {
          const data = JSON.parse(await inp.files[0].text());
          if (!data || !Array.isArray(data.notes)) throw new Error();
          if (!confirm('Backup einspielen? Die aktuellen Daten werden ersetzt.')) return;
          S = Object.assign(defaultState(), data); S.settings = Object.assign(defaultSettings(), data.settings);
          save(true); applyTheme(); closeSheet(); render(); toast('Backup eingespielt');
        } catch { toast('Das ist keine gültige Tagwerk-Sicherung'); }
      };
      inp.click(); break;
    }
    case 'reset': if (confirm('Wirklich ALLE Daten löschen? Das lässt sich nicht rückgängig machen.') && confirm('Ganz sicher?')) { S = defaultState(); save(true); applyTheme(); closeSheet(); render(); } break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === 'capture') {
    const ta = f.t, txt = ta.value.trim(); if (!txt) { ta.focus(); return; }
    newNote(txt); ta.value = ''; grow(ta); toast('Im Eingang'); render();
  } else if (kind === 'todo') {
    const n = addQuickTodos(f.t.value); if (n) { f.t.value = ''; render(); setTimeout(() => $('form[data-form=todo] input')?.focus(), 0); }
  } else if (kind === 'area-archive') {
    const name = f.name.value.trim(); if (!name) return;
    const ar = { id: uid(), name }; S.areas.push(ar); save(); archiveNote(f.dataset.id, ar.id);
  } else if (kind === 'feed') {
    const url = f.url.value; f.url.value = ''; await addFeed(url);
  } else if (kind === 'habit') {
    const data = { name: f.name.value.trim(), emoji: f.emoji.value.trim(), freq: f.freq.value, target: +f.target.value || 3, auto: f.auto.checked ? 'reading' : '' };
    if (!data.name) return;
    if (f.dataset.id) Object.assign(S.habits.find(h => h.id === f.dataset.id), data);
    else S.habits.push({ id: uid(), ...data, log: {}, created: dk() });
    save(); closeSheet(); render(); if (f.dataset.id) paintHabit(f.dataset.id);
  } else if (kind === 'edtimes') {
    S.settings.editionTimes = [f.t1.value, f.t2.value, f.t3.value].filter(Boolean).sort(); save(); toast('Ausgabezeiten gespeichert'); openSettings(); render();
  } else if (kind === 'sync') {
    const token = f.token.value.trim(), pass = f.pass.value;
    if (!token) return;
    if (pass.length < 8) { toast('Sync-Passwort: mindestens 8 Zeichen'); return; }
    SY = { token, pass }; cryptoKey = null; saveSync(); toast('Verbinde mit GitHub …');
    await sync(true); openSettings(); render();
  } else if (kind === 'syncpass') {
    const pass = f.pass.value; if (pass.length < 8) { toast('Mindestens 8 Zeichen'); return; }
    const isChange = !!SY.pass && !SY.error;
    if (isChange) {
      if (!confirm('Passwort ändern? Auf deinen anderen Geräten musst du es danach neu eintragen.')) return;
      await sync(); if (SY.error) { toast('Erst Sync-Fehler beheben: ' + SY.error); return; }
      SY.pass = pass; SY.salt = null; cryptoKey = null;
      try { await writeGist(); SY.lastSync = Date.now(); SY.error = null; toast('Passwort geändert'); }
      catch (e) { SY.error = e.message; toast('Sync: ' + e.message); }
      saveSync();
    } else {
      SY.pass = pass; cryptoKey = null; saveSync(); await sync(true);
    }
    openSettings();
  } else if (kind === 'book-search') {
    const q = f.q.value.trim(); if (!q) return;
    const box = $('#book-results'); box.innerHTML = '<p class="muted">Suche …</p>';
    const res = await searchBooks(q); UI.results = res;
    if (!$('#book-results')) return;
    $('#book-results').innerHTML = res.length ? res.map((r, i) => `<button class="res" data-act="book-pick" data-i="${i}"><div class="cv">${r.cover ? `<img src="${esc(r.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div><div style="min-width:0"><b>${esc(r.title)}</b><small>${esc([r.author, r.year, r.pages ? r.pages + ' S.' : ''].filter(Boolean).join(' · '))}</small></div></button>`).join('')
      : '<p class="muted">Nichts gefunden. Versuch die ISBN oder leg das Buch manuell an.</p>';
  } else if (kind === 'book-manual') {
    const b = addBook({ title: f.title.value.trim(), author: f.author.value.trim(), pages: f.pages.value }, UI.addStatus || 'want');
    closeSheet(); UI.bookShelf = b.status; toast('Buch angelegt'); if (UI.view !== 'buecher') go('buecher'); else render();
  } else if (kind === 'book-edit') {
    const b = getBook(f.dataset.id); if (!b) return;
    const oldPages = b.pages || 0, np = Math.max(0, parseInt(f.pages.value) || 0);
    if (oldPages && np && b.page && b.status === 'reading') b.page = Math.round(b.page / oldPages * np);   // Fortschritt in % beibehalten
    b.pages = np; if (b.pages && b.page > b.pages) b.page = b.pages; if (b.status === 'done' && b.pages) b.page = b.pages;
    b.title = f.title.value.trim() || b.title; b.author = f.author.value.trim();
    b.updated = Date.now(); save(); closeSheet(); toast('Gespeichert'); refreshBooks();
  } else if (kind === 'progress') {
    setPage(getBook(f.dataset.id), Math.max(0, parseInt(f.page.value) || 0));
  } else if (kind === 'quote') {
    const text = f.text.value.trim(); if (!text) return;
    const b = getBook(f.dataset.id); b.quotes.push({ id: uid(), text, page: parseInt(f.page.value) || 0, created: Date.now() }); b.updated = Date.now(); save(); paintBook(); toast('Zitat gespeichert');
  } else if (kind === 'proxy') {
    S.settings.proxy = f.p.value.trim(); save(); toast('Proxy gespeichert');
  }
});

// ---------- Sync über GitHub Gist ----------
const SYNC_KEY = 'tagwerk.sync', CONFLICT_KEY = 'tagwerk.conflict', GIST_FILE = 'tagwerk.json';
let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch { return {}; } })();
const saveSync = () => localStorage.setItem(SYNC_KEY, JSON.stringify(SY));
let syncBusy = false, pushT;
// Ende-zu-Ende-Verschlüsselung: AES-GCM 256, Schlüssel per PBKDF2 aus dem Sync-Passwort
function b64(buf){ const u = new Uint8Array(buf); let str = ''; for (let i = 0; i < u.length; i += 0x8000) str += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(str); }
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
let cryptoKey = null, cryptoSalt = null;
async function keyFor(salt){
  if (cryptoKey && cryptoSalt === salt) return cryptoKey;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(SY.pass), 'PBKDF2', false, ['deriveKey']);
  cryptoKey = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: unb64(salt), iterations: 310000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  cryptoSalt = salt; return cryptoKey;
}
async function encryptPayload(obj){
  if (!SY.salt) { SY.salt = b64(crypto.getRandomValues(new Uint8Array(16))); saveSync(); }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await keyFor(SY.salt), new TextEncoder().encode(JSON.stringify(obj)));
  return { app:'tagwerk', enc:1, modified: obj.modified, salt: SY.salt, iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(o){
  if (!o || !o.enc) return o;
  if (!SY.pass) throw new Error('Gist ist verschlüsselt – bitte Sync-Passwort eintragen');
  try {
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(o.iv) }, await keyFor(o.salt), unb64(o.data));
    SY.salt = o.salt; return JSON.parse(new TextDecoder().decode(pt));
  } catch { cryptoKey = null; throw new Error('Falsches Sync-Passwort'); }
}
function schedulePush(){ if (!SY.token) return; clearTimeout(pushT); pushT = setTimeout(() => sync(), 4000); }
function syncText(){ return SY.error ? '⚠ ' + SY.error : SY.lastSync ? `Synchronisiert ${relDate(SY.lastSync)}` : 'Noch nicht synchronisiert'; }
async function gh(path, opt = {}){
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + SY.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (r.status === 401) throw new Error('Token ungültig oder abgelaufen');
  if (r.status === 403 || r.status === 404) throw new Error(SY.gistId && path.includes(SY.gistId) ? 'Gist nicht gefunden' : 'Token fehlt die Berechtigung „gist“');
  if (!r.ok) throw new Error('GitHub-Fehler ' + r.status);
  return r.json();
}
function syncPayload(){
  const { lastFetch, proxy, ...settings } = S.settings;
  return { app:'tagwerk', v:1, modified: S.modified || 0, notes: S.notes, areas: S.areas, habits: S.habits, books: S.books,
    feeds: S.feeds.map(({ error, lastOk, ...f }) => f), saved: S.items.filter(i => i.saved), settings };
}
function applyRemote(r){
  S.notes = r.notes || []; S.areas = r.areas || S.areas; S.habits = r.habits || []; S.books = r.books || S.books;
  S.feeds = (r.feeds || []).map(f => ({ ...(S.feeds.find(x => x.id === f.id) || {}), ...f }));
  S.settings = Object.assign(defaultSettings(), r.settings, { lastFetch: S.settings.lastFetch, proxy: S.settings.proxy });
  const ids = new Set(S.items.map(i => i.id));
  (r.saved || []).forEach(i => { if (!ids.has(i.id)) S.items.push(i); else S.items.find(x => x.id === i.id).saved = true; });
  S.items = S.items.filter(i => S.feeds.some(f => f.id === i.feedId));
  S.modified = r.modified || 0; save(true, true); applyTheme();
}
function mergeRemote(r){
  const byId = (loc, rem, pick) => { const m = new Map(loc.map(x => [x.id, x])); (rem || []).forEach(x => { const l = m.get(x.id); m.set(x.id, l ? pick(l, x) : x); }); return [...m.values()]; };
  S.notes = byId(S.notes, r.notes, (l, x) => (x.updated || 0) > (l.updated || 0) ? x : l).sort((a, b) => b.updated - a.updated);
  S.areas = byId(S.areas, r.areas, l => l);
  S.books = byId(S.books, r.books, (l, x) => (x.updated || 0) > (l.updated || 0) ? x : l);
  S.habits = byId(S.habits, r.habits, (l, x) => ({ ...l, log: { ...x.log, ...l.log } }));
  (r.feeds || []).forEach(f => { if (!S.feeds.some(x => x.id === f.id || x.url === f.url)) S.feeds.push(f); });
  const ids = new Set(S.items.map(i => i.id));
  (r.saved || []).forEach(i => { if (!ids.has(i.id)) S.items.push(i); });
}
let wroteGist = false;
async function writeGist(){
  const payload = syncPayload();
  const content = JSON.stringify(SY.pass ? await encryptPayload(payload) : payload);
  wroteGist = true;
  if (SY.gistId) await gh('/gists/' + SY.gistId, { method:'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
  else { const g = await gh('/gists', { method:'POST', body: JSON.stringify({ description:'Tagwerk Sync – nicht löschen', public:false, files: { [GIST_FILE]: { content } } }) }); SY.gistId = g.id; }
  SY.base = S.modified || 0;
}
async function sync(manual){
  if (!SY.token || syncBusy || !navigator.onLine) return;
  syncBusy = true; clearTimeout(pushT); wroteGist = false;
  try {
    if (!SY.gistId) { const list = await gh('/gists?per_page=100'); const g = list.find(x => x.files && x.files[GIST_FILE]); SY.gistId = g ? g.id : null; }
    if (!SY.gistId) { await writeGist(); }
    else {
      const g = await gh('/gists/' + SY.gistId), f = g.files[GIST_FILE];
      const raw = f ? JSON.parse(f.truncated ? await (await fetch(f.raw_url, { cache:'no-store' })).text() : f.content) : null;
      const needEncrypt = !!(SY.pass && raw && !raw.enc);
      const r = await decryptPayload(raw);   // wirft bei falschem Passwort – dann wird nichts überschrieben
      const base = SY.base || 0, rm = r ? r.modified || 0 : 0, lm = S.modified || 0;
      const remoteChanged = r && rm !== base, localChanged = lm !== base;
      if (remoteChanged && UI.noteId) { SY.pending = true; return; }   // nicht unter einer offenen Notiz austauschen
      SY.pending = false;
      if (!SY.lastSync && remoteChanged && localChanged) {   // erstes Verbinden eines Geräts mit eigenen Daten: zusammenführen
        mergeRemote(r); S.modified = Date.now(); save(true, true); await writeGist(); render(); toast('Daten dieses Geräts mit dem Gist zusammengeführt');
      } else if (remoteChanged && !localChanged) { applyRemote(r); SY.base = rm; render(); if (UI.bookId) paintBook(); toast('Neuer Stand vom anderen Gerät geladen'); }
      else if (!remoteChanged && localChanged) { await writeGist(); }
      else if (remoteChanged && localChanged) {
        if (rm > lm) { localStorage.setItem(CONFLICT_KEY, JSON.stringify(syncPayload())); applyRemote(r); SY.base = rm; render(); }
        else { localStorage.setItem(CONFLICT_KEY, JSON.stringify(r)); await writeGist(); }
        toast('Auf zwei Geräten geändert: Die neuere Version gilt, die ältere liegt als Sicherung bereit');
      } else if (!r) { await writeGist(); }
      if (needEncrypt && !wroteGist) await writeGist();
    }
    SY.lastSync = Date.now(); SY.error = null;
    if (manual) toast('Synchronisiert');
  } catch (e) {
    SY.error = e.message || 'Fehler'; if (manual) toast('Sync: ' + SY.error);
  } finally {
    syncBusy = false; saveSync();
    const st = $('#sync-status'); if (st) st.textContent = syncText();
  }
}
window.addEventListener('online', () => sync());
window.addEventListener('focus', () => sync());
setInterval(() => { if (!document.hidden) sync(); }, 60 * 1000);   // solange die App offen ist: jede Minute nach neuem Stand schauen

// ---------- Startfrage „Was wolltest du gerade?“ ----------
function showIntent(){
  if (!S.settings.intent || $('#intent')) return;
  const day = dk(); if (!S.opens || S.opens.day !== day) S.opens = { day, n: 0 }; S.opens.n++; save(false, true);
  const ed = editionInfo(), unread = S.items.filter(i => !i.read).length;
  const hasNews = S.feeds.length && (ed.due || unread);
  const open = allTodos().filter(t => !t.done).length, habOpen = S.habits.filter(h => !doneToday(h)).length;
  const newsSub = !S.feeds.length ? 'noch keine Feeds' : ed.due ? 'neue Ausgabe bereit' : unread ? `${unread} ungelesen` : `Du bist durch · nächste Ausgabe ${nextLabel(ed)}`;
  const rb = S.books.filter(b => b.status === 'reading').sort((a, b) => b.updated - a.updated)[0];
  const el = document.createElement('div'); el.id = 'intent'; el.className = 'intent';
  el.innerHTML = `<div class="intent-inner">
    <h2>Was wolltest du gerade?</h2><div class="sub">${S.opens.n}. Mal heute geöffnet</div>
    <button class="intent-btn" data-act="intent" data-i="note"><span class="ic">✎</span><span>Etwas notieren<small>Gedanke, Idee, Todo</small></span></button>
    <button class="intent-btn" data-act="intent" data-i="todos"><span class="ic">•</span><span>Etwas abhaken<small>${open} offen</small></span></button>
    <button class="intent-btn" data-act="intent" data-i="habits"><span class="ic">◎</span><span>Gewohnheit eintragen<small>${S.habits.length ? (habOpen ? `${habOpen} heute noch offen` : 'heute alles erledigt') : 'noch keine angelegt'}</small></span></button>
    ${rb ? `<button class="intent-btn" data-act="intent" data-i="read"><span class="ic">📖</span><span>Weiterlesen<small>${esc(rb.title)} · S. ${rb.page || 0}</small></span></button>` : ''}
    <button class="intent-btn" data-act="intent" data-i="news" ${hasNews ? '' : 'disabled'}><span class="ic">)))</span><span>News lesen<small>${newsSub}</small></span></button>
    <button class="skip" data-act="intent" data-i="home">Zur Übersicht</button>
    <button class="skip quiet" data-act="intent" data-i="nothing">Eigentlich nichts</button>
  </div>`;
  document.body.appendChild(el);
}
function handleIntent(i){
  const el = $('#intent'); if (!el) return;
  if (i === 'nothing') {
    el.innerHTML = `<div class="intent-inner bye"><div class="big">✓</div><h2 style="font-size:22px">Gute Entscheidung.</h2><p class="muted">Bildschirm aus, Handy weg.</p><button class="skip quiet" data-act="intent" data-i="home">doch zur Übersicht</button></div>`;
    return;
  }
  if (i === 'read') {
    const rb = S.books.filter(b => b.status === 'reading').sort((a, b) => b.updated - a.updated)[0];
    el.innerHTML = `<div class="intent-inner bye"><div class="big">📖</div><h2 style="font-size:22px">Viel Spaß beim Lesen.</h2><p class="muted">Handy weg, Buch auf.<br>Die Seite trägst du danach ein.</p>${rb ? `<button class="btn" style="margin-top:16px;align-self:center" data-act="intent" data-i="readlog" data-id="${rb.id}">Seite jetzt eintragen</button>` : ''}<button class="skip quiet" data-act="intent" data-i="home">zur Übersicht</button></div>`;
    return;
  }
  el.remove();
  if (i === 'readlog') { go('buecher'); const rb = S.books.filter(b => b.status === 'reading').sort((a, b) => b.updated - a.updated)[0]; if (rb) openProgress(rb.id); return; }
  if (i === 'note') { go('notizen'); const n = newNote(''); openNote(n.id, true); }
  else if (i === 'todos') { go('todos'); setTimeout(() => $('form[data-form=todo] input')?.focus(), 50); }
  else go({ habits:'habits', news:'news', home:'heute' }[i] || 'heute');
}

document.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.closest('.content')) e.target.remove(); }, true);

// Kurzbefehle/Siri: …/?add=Text landet im Eingang, …/?todo=Text als Todo
(() => {
  const q = new URLSearchParams(location.search);
  const add = q.get('add'), todo = q.get('todo');
  if (add && add.trim()) { newNote(add.trim()); save(true); setTimeout(() => toast('Im Eingang'), 300); }
  if (todo && todo.trim()) { addQuickTodos(todo); save(true); setTimeout(() => toast('Todo notiert'), 300); }
  if (add !== null || todo !== null) history.replaceState(null, '', location.pathname);
  else showIntent();
})();
render();
sync();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// Bei Rückkehr in die App: Tageswechsel & neue Ausgabe berücksichtigen
let lastDay = dk(), hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (SY.token && (S.modified || 0) !== (SY.base || 0)) sync(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 90 * 1000 && !UI.noteId) showIntent();
  sync();
  if (dk() !== lastDay) { lastDay = dk(); }
  if (!pageStack.length) render();
  if (UI.view === 'news' && editionInfo().due && S.feeds.length) refreshFeeds();
});
